                <div class="description">
                    <br>
                    <h3>
                        1782年2月6日11時3分、ニジロ州ミカニ県エザナ市にて、未知の生物を捕獲した。これはこの生物の観察記録である。
                    </h3>
                    <h2>1日目</h2>
                    木箱に入れて観察。動きは少ない。柔らかく極めて弾力がある。餌がわからない。生の米を与えたが食べない。
                    <h2>2日目</h2>
                    追加で長さ1シニア大きくなる。
                    <img src="newlang2/0.png" width="100%">
                    <h2>3日目</h2>
                    小さくなる。長さ4シニアである。
                    <h2>4日目</h2>
                    両目の間に割れ目が出現。中は赤い。
                    <h2>5日目</h2>
                    目が丸くなる。割れ目が大きくなる。
                    <h2>6日目</h2>
                    消えた。
                    <img src="newlang2/1.png" width="100%">
                </div>
